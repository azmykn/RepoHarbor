# repoharbor-platform — Linux desktop integration with no UI and no Tauri. The home
# for what used to live behind Tauri plugins/AppHandle: appearance (XDG portal +
# kdeglobals), tray, global shortcut, notifications, file watching.
# The native GPUI app consumes it.
[package]
name = "repoharbor-platform"
version = "2026.8.1"
edition = "2021"
authors = ["Azmy Karam <azmykn@gmail.com>"]
license = "MIT"
repository = "https://github.com/azmykn/RepoHarbor"
homepage = "https://azmykn.github.io/RepoHarbor/"
description = "Linux desktop integration for RepoHarbor"

[dependencies]
# Logic: scan/config for the file-watcher, inbox/oauth/cache for the poller.
repoharbor-core = { path = "../repoharbor-core" }
dirs = "6"               # XDG data path for the KRunner dbusplugin descriptor
serde = { version = "1", features = ["derive"] }
serde_json = "1"         # attention-snapshot dedupe
zbus = "5"               # D-Bus: appearance portal + desktop notifications
futures-util = "0.3"     # signal stream
tokio = { version = "1", features = ["rt", "time"] }  # drive the poll interval (+ reqwest) off the UI thread
notify-debouncer-mini = "0.4"                 # inotify live-watch (debounced)
# StatusNotifierItem tray (pure D-Bus, no GTK). async-io backend to match gpui's
# zbus (its portal/accessibility connections); the tokio backend would force
# every zbus connection in the process — including gpui's — through tokio and
# panic them. `blocking` gives a synchronous spawn/update API (ksni owns the
# thread + executor), so the app needs no extra runtime for the tray.
ksni = { version = "0.3.5", default-features = false, features = ["async-io", "blocking"] }
png = "0.18"             # decode the tray glyph PNGs to ARGB for the SNI pixmap
# Global-shortcut portal (Wayland-native summon hotkey). async-io backend (NOT
# the default "tokio", which would force zbus/tokio and panic gpui's async-io
# zbus connections — same constraint as the tray).
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "file_chooser"] }

[dev-dependencies]
tempfile = "3"           # watcher target-computation tests

[lints.clippy]
all = "warn"
