# repoharbor-core — all of RepoHarbor's logic with zero UI and zero Tauri. Scanning,
# git, host APIs (GitHub/GitLab), local AI (Ollama + bundled llama.cpp), the
# SQLite cache, config, and launchers. The native GPUI app depends on this; it
# knows nothing about the UI.
[package]
name = "repoharbor-core"
version = "2026.11.2"
edition = "2021"
authors = ["Digital Integrated Transformation Solutions (DigitsCode) <info@digitscode.com>"]
license = "MIT"
repository = "https://github.com/azmykn/RepoHarbor"
homepage = "https://azmykn.github.io/RepoHarbor/"
description = "every repo at harbor — core logic for RepoHarbor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Repo discovery + metadata (versions match the legacy crate deliberately).
git2 = "0.20"                                             # libgit2 (vendored)
chrono = "0.4"                                            # contribution-graph date math
walkdir = "2"                                             # repo scanning
globset = "0.4"                                           # ignore-glob matching
toml = "1"                                                # config file
dirs = "6"                                                # XDG config/data paths
which = "8"                                                # detect IDE/terminal on PATH
rusqlite = { version = "0.32", features = ["bundled"] }   # cache (SQLite bundled)

# Git host providers + AI HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
urlencoding = "2"
futures-util = "0.3"                                      # stream combinators (ai.rs SSE)
# Only the timer (oauth device-flow poll backoff). No runtime here — the caller
# (app) drives async; logic stays runtime-agnostic where it can.
tokio = { version = "1", features = ["time"] }
# Embedded PTY shell + ANSI/VT100 state machine for the internal terminal dock.
portable-pty = "0.8"
vt100 = "0.15"
async-channel = "2"

# Update archive verification & extraction (GitHub Release tarballs + checksums).
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"
