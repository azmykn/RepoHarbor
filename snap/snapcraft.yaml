name: repoharbor
title: RepoHarbor
base: core24
version: '2026.11.3'
summary: Command center to manage, inspect, and sync fleets of Git repositories
description: |
  **RepoHarbor** is a high-performance desktop command center built specifically for Linux developers who manage dozens or hundreds of Git repositories, microservices, and nested submodule trees.

  Unlike single-repo tools or bloated webview/Electron clients, RepoHarbor is engineered in pure Rust on GPUI (the GPU-native framework powering Zed). It renders directly via Vulkan over Wayland and X11 at a buttery 60/120+ FPS, consumes minimal system memory, and works completely offline thanks to a persistent local SQLite cache.

  ### ⚡ Instant Fleet Situational Awareness
  - **High-Density Virtualized Fleet:** Scales effortlessly to 500+ repositories with zero scroll stutter or memory leaks.
  - **Smart Attention Queues:**
    - **Needs Me:** Automatically flags broken CI builds, pending PR reviews, uncommitted changes, merge conflicts, and diverged branches.
    - **Behind:** Highlights every repository lagging behind remote upstreams at a glance.
    - **Working:** Instantly filters to active workspaces with unstaged edits, staged index files, or unpushed commits.
  - **Multi-Faceted Instant Search:** Filter in real-time by name, folder prefix, language (`lang:rust`, `lang:python`), state (`is:dirty`, `is:behind`), or remote host (`host:github`, `host:gitlab`).

  ### 🚀 Coordinated Fleet Operations
  - **Bulk Fetch & Pull:** Synchronize 5, 20, or 100 repositories simultaneously with atomic progress indicators.
  - **Pull Behind:** One-click fast-forward for all out-of-date repositories in one single pass.
  - **Deep Submodule Management:** Automatically discovers nested `.gitmodules` trees, suppresses noise from top-level views, and provides one-click bulk submodule updates across your whole workspace.
  - **Protected Upstream Trees:** Guard critical framework cores and vendor directories from accidental commits or force-pushes with pull-only rules.

  ### 🛠️ Deep-Dive Inspection Drawer
  - **Interactive Syntax-Highlighted Diff:** Inspect changes per hunk with side-by-side or unified views and copy full absolute file paths with one click.
  - **Interactive Commit Composer:** Stage individual hunks or entire files, author clean commit messages, and push directly.
  - **Pre-Commit Secret Scanner:** Automatically scans commit payloads for accidental API tokens, secret keys, and credentials before creating unsafe commits.
  - **Universal Launchers:** Open any repository or specific file directly inside your preferred IDE (VS Code, Cursor, Zed, PyCharm, CLion) or terminal emulator (`kitty`, `alacritty`, `ghostty`, `gnome-terminal`).
  - **Branch Switching & Merge Recovery:** Quick-switch branches, merge into HEAD with one click, and cleanly abort conflicting merges.

  ### 🔒 Privacy & Performance Contract
  - **Zero Webview Overhead:** Native GPU-rendered UI that stays responsive even under heavy compilation loads.
  - **Local-First & Offline Capable:** All repository states, branch histories, and caches reside in a local SQLite database on your machine.
  - **Optional On-Device AI:** Generate commit messages and changelogs locally via Ollama / llama.cpp without sending private code to external clouds.

  Developed by Digital Integrated Transformation Solutions (DigitsCode).
grade: stable
confinement: classic
license: MIT
website: https://azmykn.github.io/RepoHarbor/
contact: info@digitscode.com
issues: https://github.com/azmykn/RepoHarbor/issues
source-code: https://github.com/azmykn/RepoHarbor

apps:
  repoharbor:
    command: bin/repoharbor
    desktop: usr/share/applications/repoharbor.desktop
    environment:
      XDG_DATA_DIRS: $SNAP/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}

parts:
  repoharbor:
    plugin: rust
    source: .
    rust-channel: '1.95.0'
    build-packages:
      - build-essential
      - cmake
      - pkg-config
      - libvulkan-dev
      - libwayland-dev
      - libxkbcommon-dev
      - libxkbcommon-x11-dev
      - libxcb1-dev
      - libfontconfig1-dev
      - libssl-dev
    stage-packages:
      - libvulkan1
      - libwayland-client0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libfontconfig1
      - libssl3
    override-build: |
      cargo build --release -p repoharbor
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp target/release/repoharbor $CRAFT_PART_INSTALL/bin/repoharbor
      install -Dm644 packaging/repoharbor.desktop $CRAFT_PART_INSTALL/usr/share/applications/repoharbor.desktop
      install -Dm644 packaging/icons/128x128@2x.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/repoharbor.png
      install -Dm644 packaging/icons/repoharbor.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/repoharbor.svg
