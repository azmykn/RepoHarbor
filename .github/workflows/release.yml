name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI build deps (Vulkan/Wayland/xkbcommon/fontconfig) + tools the
      # packagers need (file for cargo-deb, desktop-file-utils + fuse for the
      # AppImage).
      - name: Install build & packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfontconfig1-dev libssl-dev \
            build-essential cmake pkg-config \
            file desktop-file-utils libfuse2

      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2

      # Don't ship from a commit that fails the suite, even if the tag was
      # pushed by hand.
      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p repoharbor

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build .deb
        run: cargo deb -p repoharbor --no-build

      - name: Build .rpm
        run: cargo generate-rpm -p crates/repoharbor

      # Fetch a pinned llama.cpp build so the bundled AI backend works out of the
      # box in the AppImage. Bump LLAMA_TAG to update the shipped engine. Only the
      # AppImage bundles it; deb/rpm stay lean (Ollama / user-installed llama).
      - name: Fetch llama-server runtime (AppImage only)
        env:
          LLAMA_TAG: b9551
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          asset="llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          curl -fsSL -o "$work/llama.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${asset}"
          tar xzf "$work/llama.tar.gz" -C "$work"
          mkdir -p packaging/llama-runtime
          # Archive layout varies by tag; flatten llama-server + its shared libs.
          # Keep symlinks (-type l, cp -P): the sonames (libllama.so.0 → …) are
          # same-directory relative links, and linuxdeploy fails without them.
          find "$work" \( -type f -o -type l \) -name 'llama-server' -exec cp -P {} packaging/llama-runtime/ \;
          find "$work" \( -type f -o -type l \) -name '*.so*' -exec cp -P {} packaging/llama-runtime/ \;
          chmod +x packaging/llama-runtime/llama-server
          rm -rf "$work"
          ls -la packaging/llama-runtime

      - name: Build AppImage
        run: bash packaging/appimage.sh

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist stage/repoharbor
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          # RepoHarbor-* only: appimage.sh also downloads linuxdeploy into dist-appimage.
          cp dist-appimage/RepoHarbor-*.AppImage dist/
          # Standalone binary tarball for fast zero-sudo user install & self-updates.
          install -Dm755 target/release/repoharbor stage/repoharbor/repoharbor
          install -Dm644 packaging/repoharbor.desktop stage/repoharbor/repoharbor.desktop
          cp -r packaging/icons stage/repoharbor/icons
          TAG="${GITHUB_REF_NAME#v}"
          tar -czf "dist/repoharbor-v${TAG}-linux-x86_64.tar.gz" -C stage repoharbor
          rm -rf stage
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Build release binary (${{ matrix.target }})
        run: cargo build --release -p repoharbor --target ${{ matrix.target }}

      - name: Package macOS archive & .app bundle
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          BIN="target/${{ matrix.target }}/release/repoharbor"
          mkdir -p dist stage/repoharbor
          cp "$BIN" stage/repoharbor/repoharbor
          chmod 755 stage/repoharbor/repoharbor
          cp -r packaging/icons stage/repoharbor/icons

          # Create self-contained RepoHarbor.app bundle inside the archive too.
          APP="stage/repoharbor/RepoHarbor.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp "$BIN" "$APP/MacOS/repoharbor"
          chmod 755 "$APP/MacOS/repoharbor"
          cp packaging/icons/icon.png "$APP/Resources/icon.png"
          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>RepoHarbor</string>
            <key>CFBundleDisplayName</key>
            <string>RepoHarbor</string>
            <key>CFBundleIdentifier</key>
            <string>com.digitscode.repoharbor</string>
            <key>CFBundleVersion</key>
            <string>${TAG}</string>
            <key>CFBundleShortVersionString</key>
            <string>${TAG}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>repoharbor</string>
            <key>CFBundleIconFile</key>
            <string>icon.png</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          tar -czf "dist/repoharbor-v${TAG}-macos-${{ matrix.arch }}.tar.gz" -C stage repoharbor
          rm -rf stage
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build release binary
        run: cargo build --release -p repoharbor

      - name: Package Windows archives (.tar.gz & .zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path "dist", "stage\repoharbor" | Out-Null
          Copy-Item "target\release\repoharbor.exe" "stage\repoharbor\repoharbor.exe"
          Copy-Item "LICENSE", "NOTICE", "COPYRIGHT.md" "stage\repoharbor\"
          Copy-Item "packaging\icons" "stage\repoharbor\icons" -Recurse
          tar -czf "dist\repoharbor-v${Tag}-windows-x86_64.tar.gz" -C stage repoharbor
          Compress-Archive -Path "stage\repoharbor\*" -DestinationPath "dist\repoharbor-v${Tag}-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force stage
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error

  build-snap:
    name: Build Snap (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - uses: actions/upload-artifact@v4
        with:
          name: release-snap-x86_64
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Publish to Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

  publish:
    name: Publish unified release (Linux, macOS, Windows)
    needs: [build-linux, build-macos, build-windows, build-snap]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
          generate_release_notes: true
          body: |
            Native GPUI builds of **RepoHarbor** for **Linux**, **macOS**, and **Windows** from the same unified codebase.
            See the [documentation](https://azmykn.github.io/RepoHarbor/) for setup and usage.

            ### Quick Install / Update (Zero Sudo)

            - **Linux & macOS:**
              ```sh
              curl -fsSL https://raw.githubusercontent.com/azmykn/RepoHarbor/main/scripts/install.sh | bash
              ```
            - **Snap (Linux):**
              ```sh
              sudo snap install --classic repoharbor
              ```
            - **Windows (PowerShell):**
              ```powershell
              irm https://raw.githubusercontent.com/azmykn/RepoHarbor/main/scripts/install.ps1 | iex
              ```
            - **In-App & CLI Auto-Update (All Platforms):**
              Click **`Update`** in the top header bar inside RepoHarbor, or run `repoharbor update` in your terminal.
